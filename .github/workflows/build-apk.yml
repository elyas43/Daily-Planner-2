name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Android ZIP
        run: |
          ls -lah
          test -f daily-planner-android-github-fixed.zip

      - name: Extract Android Project
        run: |
          unzip -o daily-planner-android-github-fixed.zip -d android-project

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java Version
        run: |
          java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: android-project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Check APK
        run: |
          ls -lh android-project/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-planner-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
