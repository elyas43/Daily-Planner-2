name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Android ZIP
        run: |
          echo "Repository files:"
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP file not found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android Project
        run: |
          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 3 -type f | head -100

      - name: Find Android Project Directory
        run: |
          echo "Searching for Android project..."

          SETTINGS_FILE=$(find android-project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Found settings file: $SETTINGS_FILE"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          BUILD_FILE=$(find android-project -type f \( \
            -name "build.gradle" \
            -o -name "build.gradle.kts" \
          \) | head -n 1)

          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
            echo "Found build file: $BUILD_FILE"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "ERROR: Android Gradle project not found!"
          find android-project -type f
          exit 1

      - name: Show Project
        run: |
          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort

      - name: Add Firebase Configuration
        run: |
          echo "Adding Firebase configuration..."

          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json not found!"
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app"
          cp google-services.json "$PROJECT_DIR/app/google-services.json"

          echo "Firebase configuration added."

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java Version
        run: |
          java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle Version
        run: |
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Check APK
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -ls

      - name: Get SHA-1
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle signingReport || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-planner-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
