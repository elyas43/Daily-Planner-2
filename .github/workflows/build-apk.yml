name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Android ZIP
        run: |
          echo "Files in repository:"
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP file not found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV

      - name: Extract Android Project
        run: |
          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | head -100

      - name: Find Project Directory
        run: |
          echo "Searching for Gradle project..."

          if [ -f "android-project/gradlew" ]; then
            echo "Project found in android-project"
            echo "PROJECT_DIR=android-project" >> $GITHUB_ENV
          else
            PROJECT_DIR=$(find android-project -name "gradlew" -type f | head -n 1 | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: gradlew not found!"
              exit 1
            fi

            echo "Project found: $PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          fi

      - name: Add Firebase Configuration
        run: |
          echo "Adding google-services.json..."

          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json not found!"
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app"
          cp google-services.json "$PROJECT_DIR/app/google-services.json"

          echo "Firebase configuration copied successfully."

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java Version
        run: |
          java -version

      - name: Make Gradle Executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew :app:assembleDebug --no-daemon

      - name: Check APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" -ls

      - name: Get SHA-1
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew signingReport || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-planner-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
