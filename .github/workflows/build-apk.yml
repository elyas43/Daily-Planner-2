name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Find Android ZIP
      # --------------------------------------------------
      - name: Find Android ZIP
        id: find_zip
        shell: bash
        run: |
          echo "Searching for Android ZIP..."

          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android ZIP file found!"
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 3. Extract Android Project
      # --------------------------------------------------
      - name: Extract Android Project
        shell: bash
        run: |
          echo "Extracting Android project..."

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction completed."

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort

      # --------------------------------------------------
      # 4. Find Android Project Directory
      # --------------------------------------------------
      - name: Find Android Project Directory
        shell: bash
        run: |
          echo "Searching for Android Gradle project..."

          PROJECT_DIR=$(find extracted \
            -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found!"
            echo "Searching for Gradle files..."

            find extracted \
              -type f \
              -name "build.gradle" -o -name "build.gradle.kts" \
              -print

            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 5. Show Project
      # --------------------------------------------------
      - name: Show Project
        shell: bash
        run: |
          echo "======================================"
          echo "Android project directory:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      # --------------------------------------------------
      # 6. Add Firebase Configuration
      # --------------------------------------------------
      - name: Add Firebase Configuration
        shell: bash
        run: |
          echo "======================================"
          echo "Checking Firebase configuration..."
          echo "======================================"

          mkdir -p "$PROJECT_DIR/app"

          # First check if google-services.json
          # already exists inside app/
          if [ -f "$PROJECT_DIR/app/google-services.json" ]; then

            echo "google-services.json already exists in app/"
            echo "No copy is required."

          else

            echo "google-services.json is not in app/."

            # Search the whole extracted project
            FIREBASE_FILE=$(find "$PROJECT_DIR" \
              -type f \
              -name "google-services.json" \
              -print -quit)

            if [ -z "$FIREBASE_FILE" ]; then
              echo "ERROR: google-services.json not found!"
              echo ""
              echo "Files inside project:"
              find "$PROJECT_DIR" -maxdepth 4 -type f | sort
              exit 1
            fi

            echo "Firebase file found:"
            echo "$FIREBASE_FILE"

            cp "$FIREBASE_FILE" \
              "$PROJECT_DIR/app/google-services.json"

            echo "Firebase configuration copied to:"
            echo "$PROJECT_DIR/app/google-services.json"

          fi

          echo ""
          echo "Final Firebase location:"
          ls -lh "$PROJECT_DIR/app/google-services.json"

      # --------------------------------------------------
      # 7. Check Firebase Configuration
      # --------------------------------------------------
      - name: Check Firebase Configuration
        shell: bash
        run: |
          echo "Checking Firebase configuration..."

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ERROR: Firebase configuration missing!"
            exit 1
          fi

          echo "Firebase configuration OK."

      # --------------------------------------------------
      # 8. Setup Java
      # --------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --------------------------------------------------
      # 9. Check Java Version
      # --------------------------------------------------
      - name: Check Java Version
        shell: bash
        run: |
          java -version

      # --------------------------------------------------
      # 10. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android
